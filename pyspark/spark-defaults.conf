# ============================================================
# Spark Default Configuration - Suppress all warnings
# ============================================================

# Logging Configuration
spark.driver.extraJavaOptions -Dlog4j.configuration=file:///opt/spark/conf/log4j.properties -Dlog4j.logLevel=ERROR
spark.executor.extraJavaOptions -Dlog4j.configuration=file:///opt/spark/conf/log4j.properties -Dlog4j.logLevel=ERROR

# Network Configuration
spark.driver.host 127.0.0.1
spark.driver.bindAddress 127.0.0.1

# Local Configuration
spark.submit.deployMode client

# Suppress specific warnings
spark.hadoop.mapred.output.compress false
spark.sql.adaptive.enabled true

# Hive Metastore Configuration - Suppress warnings
spark.hadoop.hive.metastore.client.factory.class org.apache.hadoop.hive.metastore.HiveMetaStoreClient
spark.sql.catalogImplementation hive
