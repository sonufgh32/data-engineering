name: Deployment Workflow

on:
    # push:
    #     branches:
    #         - main
    workflow_dispatch:

permissions:
    contents: read
    deployments: write

env:
    NODE_VERSION: 20
    IMAGE_NAME: enterprise-webapp

defaults:
    run:
        shell: bash

jobs:
    build:
        name: Build And Package
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/github-actions-container
        
        outputs:
            image-tag: ${{ steps.meta.outputs.image-tag }}

        env:
            MONGODB_CONNECTION_PROTOCOL: mongodb
            MONGODB_CLUSTER_ADDRESS: 127.0.0.1:27017 # mongodb
            MONGODB_USERNAME: root
            MONGODB_PASSWORD: example
            PORT: 8080
        services:
          mongodb:
            image: mongo
            ports:
              - 27017:27017
            env:
              MONGO_INITDB_ROOT_USERNAME: root
              MONGO_INITDB_ROOT_PASSWORD: example
    
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Install Dependencies
              run: npm ci

            - name: Build Application
              run: npm run build

            - name: Generate Image Tag
              id: meta
              run: |
                TAG=${GITHUB_SHA::7}
                echo "image-tag=$TAG" >> $GITHUB_OUTPUT

            - name: Build Docker Image
              run: |
                docker build \
                -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
                .

            - name: Save Docker Image
              run: |
                docker save \
                ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
                -o app-image.tar

            - name: Upload Docker Artifact
              uses: actions/upload-artifact@v4
              with:
                name: docker-image
                path: app-image.tar

    deploy-dev:
        name: Deploy To Development
        runs-on: ubuntu-latest

        needs:
            - build

        environment:
            name: development
            url: https://dev.example.com

        steps:
            - name: Download Docker Artifact
              uses: actions/download-artifact@v4
              with:
                name: docker-image

            - name: Load Docker Image
              run: docker load -i app-image.tar

            - name: Deploy To Development Server
              run: |
                echo "Deploying to development environment"

            - name: Verify Deployment
              run: |
                echo "Health check success"

    deploy-staging:
        name: Deploy To Staging
        runs-on: ubuntu-latest

        needs:
            - deploy-dev

        environment:
            name: staging
            url: https://staging.example.com

        steps:
            - name: Deploy To Staging
              run: |
                echo "Deploying to staging"

            - name: Smoke Tests
              run: |
                echo "Smoke tests passed"

    deploy-production:
        name: Deploy To Production
        runs-on: ubuntu-latest

        needs:
            - deploy-staging

        environment:
            name: production
            url: https://example.com

        concurrency:
            group: production-deployment
            cancel-in-progress: false

        steps:
            - name: Production Approval Check
              run: |
                echo "Deployment approved"

            - name: Deploy Production Release
              run: |
                echo "Deploying production release"

            - name: Run Production Health Checks
              run: |
                echo "Production healthy"

            - name: Notify Deployment Success
              run: |
                echo "Deployment successful"