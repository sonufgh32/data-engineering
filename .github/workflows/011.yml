name: Deployment Tags

on:
    push:
        branches:
            - main
    workflow_dispatch:

defaults:
    run:
        shell: bash
        working-directory: frontend/github-actions-third

env:
    NODE_VERSION: 20
    ARTIFACT_NAME: frontend-build

jobs:
    lint:
        name: Lint Source Code
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Install Dependencies
              run: npm install

            - name: Run ESLint
              run: npm run lint

    unit-test:
        name: Run Unit Tests
        runs-on: ubuntu-latest
        needs:
            - lint

        strategy:
            matrix:
                node-version: [18, 16]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers
              run: npx playwright install --with-deps

            - name: Run Playwright Tests
              run: npm run test

    build:
        name: Build Application
        runs-on: ubuntu-latest
        needs:
            - unit-test
        outputs:
            build-version: ${{ steps.build-info.outputs.version }}
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup NodeJS
              uses: actions/setup-node@v4
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: Install Dependencies
              run: npm ci

            - name: Build Frontend
              run: npm run build

            - name: Extract Version
              id: build-info
              run: |
                VERSION=$(node -p "require('./package.json').version")
                echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: List Files
              run: |
                ls -la

            - name: Upload Build Artifact
              uses: actions/upload-artifact@v4
              with:
                name: ${{ env.ARTIFACT_NAME }}
                path: app/dist

    docker-validation:
        name: Validate Docker Image
        runs-on: ubuntu-latest
        needs:
            - build
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Download Artifact
              uses: actions/download-artifact@v4
              with:
                name: ${{ env.ARTIFACT_NAME }}
                path: dist
        
            - name: Build Docker Image
              run: |
                docker build -t sample-app:${{ needs.build.outputs.build-version }} .

            - name: Verify Docker Image
              run: |
                docker images