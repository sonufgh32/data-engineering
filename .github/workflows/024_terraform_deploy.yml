name: 024 - Terraform Actions

on:
    workflow_dispatch:
        inputs:
            terraform_path:
                description: 'Terraform folder to deploy from (relative to data-engineering/)'
                required: true
                default: 'terraform/terraform-scripts/github-action-multi-region-deploy'
                type: string
            aws_region:
                description: 'AWS region for the deployment'
                required: true
                default: 'ap-south-1'
                type: choice
                options:
                    - us-east-1
                    - us-west-2
                    - eu-west-1
                    - ap-south-1
            environment:
                description: 'Environment name (for example: dev/test/prod)'
                required: true
                default: 'dev'
                type: choice
                options:
                    - dev
                    - test
                    - prod
            lambda_name:
                description: 'Lambda resource name prefix'
                required: true
                default: 'development'
                type: choice
                options:
                    - testing
                    - development
                    - production
            tf_action:
                description: 'Terraform action to run'
                required: true
                default: 'plan'
                type: choice
                options:
                    - plan
                    - apply
                    - destroy

permissions:
    contents: read
    id-token: write

jobs:
    account-info:
        name: Get AWS account info
        runs-on: ubuntu-latest

        outputs:
            account_id: ${{ steps.aws_account.outputs.account_id }}
            account_alias: ${{ steps.aws_account.outputs.account_alias }}

        steps:
            - name: Configure aws credentials
              uses: aws-actions/configure-aws-credentials@v1.7.0
              with:
                role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
                aws-region: ${{ inputs.aws_region }}
                role-session-name: github-actions-terraform-deploy

            - name: Get AWS account details from OIDC session
              id: aws_account
              run: |
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                ACCOUNT_ALIAS=$(aws iam list-account-aliases --query 'AccountAliases[0]' --output text 2>/dev/null || true)

                echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
                echo "account_alias=${ACCOUNT_ALIAS:-$ACCOUNT_ID}" >> "$GITHUB_OUTPUT"
                echo "AWS account ID: $ACCOUNT_ID"
                echo "AWS account alias: ${ACCOUNT_ALIAS:-$ACCOUNT_ID}"

    terraform-plan:
        needs: account-info
        name: Terraform Plan
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: latest

            - name: Configure aws credentials
              uses: aws-actions/configure-aws-credentials@v1.7.0
              with:
                role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
                aws-region: ${{ inputs.aws_region }}
                role-session-name: github-actions-terraform-deploy

            - name: Terraform Init
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform init -input=false \
                    -backend-config="bucket=terraform-state-741448939728" \
                    -backend-config="key=${{ needs.account-info.outputs.account_alias }}/${{ inputs.aws_region }}/terraform.tfstate" \
                    -backend-config="region=${{ inputs.aws_region }}" \
                    -backend-config="use_lockfile=true" \
                    -backend-config="encrypt=true"

            - name: Terraform Validate
              working-directory: ${{ inputs.terraform_path }}
              run: terraform validate

            - name: Terraform Plan
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform plan -input=false \
                    -var="aws_region=${{ inputs.aws_region }}" \
                    -var="environment=${{ inputs.environment }}" \
                    -var="lambda_name=${{ inputs.lambda_name }}"

            - name: Write GitHub Summary
              if: always()
              run: |
                {
                  echo '## ✨ Terraform Plan Summary'
                  echo ''
                  echo '### 📋 Run Details'
                  echo "- Workflow: ${{ github.workflow }}"
                  echo "- Run ID: ${{ github.run_id }}"
                  echo "- Run Number: ${{ github.run_number }}"
                  echo "- Triggered by: ${{ github.actor }}"
                  echo "- Commit: ${{ github.sha }}"
                  echo "- Action selected: ${{ inputs.tf_action }}"
                  echo "- Terraform path: ${{ inputs.terraform_path }}"
                  echo "- AWS region: ${{ inputs.aws_region }}"
                  echo "- Environment: ${{ inputs.environment }}"
                  echo "- Lambda resource prefix: ${{ inputs.lambda_name }}"
                  echo "- AWS account alias: ${{ needs.account-info.outputs.account_alias }}"
                  echo ''
                  echo '### 🚀 Next Step'
                  echo 'Use the apply job when you are ready to provision the changes.'
                } >> "$GITHUB_STEP_SUMMARY"

    terraform-apply:
        name: Terraform Apply
        needs: [account-info, terraform-plan]
        if: ${{ inputs.tf_action == 'apply' }}
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: latest

            - name: Configure aws credentials
              uses: aws-actions/configure-aws-credentials@v1.7.0
              with:
                role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
                aws-region: ${{ inputs.aws_region }}
                role-session-name: github-actions-terraform-deploy

            - name: Terraform Init
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform init -input=false \
                    -backend-config="bucket=terraform-state-741448939728" \
                    -backend-config="key=${{ needs.account-info.outputs.account_alias }}/${{ inputs.aws_region }}/terraform.tfstate" \
                    -backend-config="region=${{ inputs.aws_region }}" \
                    -backend-config="use_lockfile=true" \
                    -backend-config="encrypt=true"

            - name: Terraform Apply
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform apply -auto-approve -input=false \
                    -var="aws_region=${{ inputs.aws_region }}" \
                    -var="environment=${{ inputs.environment }}" \
                    -var="lambda_name=${{ inputs.lambda_name }}"

            - name: Write GitHub Summary
              if: always()
              run: |
                {
                  echo '## ✅ Terraform Apply Summary'
                  echo ''
                  echo '### 📦 Deployment Details'
                  echo "- Workflow: ${{ github.workflow }}"
                  echo "- Run ID: ${{ github.run_id }}"
                  echo "- Run Number: ${{ github.run_number }}"
                  echo "- Triggered by: ${{ github.actor }}"
                  echo "- Commit: ${{ github.sha }}"
                  echo "- Terraform path: ${{ inputs.terraform_path }}"
                  echo "- AWS region: ${{ inputs.aws_region }}"
                  echo "- Environment: ${{ inputs.environment }}"
                  echo "- Lambda resource prefix: ${{ inputs.lambda_name }}"
                  echo "- AWS account alias: ${{ needs.account-info.outputs.account_alias }}"
                  echo ''
                  echo '### 🎯 Result'
                  echo 'The apply job has finished. Review the Terraform logs above for the exact resource changes.'
                } >> "$GITHUB_STEP_SUMMARY"

    terraform-destroy:
        name: Terraform Destroy
        needs: [account-info, terraform-plan]
        if: ${{ inputs.tf_action == 'destroy' }}
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: latest

            - name: Configure aws credentials
              uses: aws-actions/configure-aws-credentials@v1.7.0
              with:
                role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
                aws-region: ${{ inputs.aws_region }}
                role-session-name: github-actions-terraform-deploy

            - name: Terraform Init
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform init -input=false \
                    -backend-config="bucket=terraform-state-741448939728" \
                    -backend-config="key=${{ needs.account-info.outputs.account_alias }}/${{ inputs.aws_region }}/terraform.tfstate" \
                    -backend-config="region=${{ inputs.aws_region }}" \
                    -backend-config="use_lockfile=true" \
                    -backend-config="encrypt=true"

            - name: Terraform Destroy
              working-directory: ${{ inputs.terraform_path }}
              run: |
                terraform destroy -auto-approve -input=false \
                    -var="aws_region=${{ inputs.aws_region }}" \
                    -var="environment=${{ inputs.environment }}" \
                    -var="lambda_name=${{ inputs.lambda_name }}"

            - name: Write GitHub Summary
              if: always()
              run: |
                {
                  echo '## 🧹 Terraform Destroy Summary'
                  echo ''
                  echo '### ⚠️ Destruction Details'
                  echo "- Workflow: ${{ github.workflow }}"
                  echo "- Run ID: ${{ github.run_id }}"
                  echo "- Run Number: ${{ github.run_number }}"
                  echo "- Triggered by: ${{ github.actor }}"
                  echo "- Commit: ${{ github.sha }}"
                  echo "- Terraform path: ${{ inputs.terraform_path }}"
                  echo "- AWS region: ${{ inputs.aws_region }}"
                  echo "- Environment: ${{ inputs.environment }}"
                  echo "- Lambda resource prefix: ${{ inputs.lambda_name }}"
                  echo "- AWS account alias: ${{ needs.account-info.outputs.account_alias }}"
                  echo ''
                  echo '### 🎯 Result'
                  echo 'The destroy job has completed. Confirm the teardown outcome in the Terraform logs above.'
                } >> "$GITHUB_STEP_SUMMARY"