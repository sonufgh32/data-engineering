name: Composte Action - Deployment

on:
    push:
        branches:
            - main

    workflow_dispatch:

env:
    WORK_DIR: frontend/github-composite-actions

defaults:
    run:
        working-directory: frontend/github-composite-actions

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3

            - name: Load & cache dependencies
              uses: ./.github/actions/cached-deps/
              with:
                working-directory: ${{ env.WORK_DIR }}
        
            - name: Lint code
              run: npm run lint
  
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3
        
            - name: Load & cache dependencies
              uses: ./.github/actions/cached-deps/
              with:
                working-directory: ${{ env.WORK_DIR }}

            - name: Test code
              id: run-tests
              run: npm run test
            
            - name: Upload test report
              if: failure() && steps.run-tests.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: test.json

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3

            - name: Load & cache dependencies
              uses: ./.github/actions/cached-deps/
              with:
                working-directory: ${{ env.WORK_DIR }}

            - name: Build website
              run: |
                npm run build
            
            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: dist-files
                path: ${{ env.WORK_DIR }}/dist
    
    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v3

            - name: Get build artifacts
              uses: actions/download-artifact@v4
              with:
                name: dist-files
                path: ./dist
            
            - name: Output contents
              run: ls

            - name: Deploy site
              run: echo "Deploying..."