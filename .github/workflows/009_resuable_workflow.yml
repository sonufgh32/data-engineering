name: Resuable Workflow

on:
    workflow_call:
        inputs:
            artifact-name:
                description: 'Name of the artifact to download'
                default: 'dist-files'
                required: true
                type: string

        secrets:
            some-secret:
                description: 'A secret that can be used in the reusable workflow'
                required: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/download-artifact@v4
              with:
                name: ${{ inputs.artifact-name }}

            - name: Output contents
              run: |
                ls -la
                echo ${{ secrets.some-secret }}

            - name: Run deployment script
              run: echo "Deploying application..."