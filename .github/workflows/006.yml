name: Execution Flow - Cache Hit

# failure(): Returns true when any previous steps or jobs have failed.
# success(): Returns true when all previous steps have failed.
# always(): Causes the step to always execute, even when cancelled.
# cancelled(): Returns true if the workflow has been cancelled.

on:
    # push:
    #     branches:
    #         - main
    workflow_dispatch: # Allows manual triggering of the workflow from the GitHub Actions tab

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            
            - name: Cache Dependencies
              id: cache
              uses: actions/cache@v3
              with:
                path: frontend/github-actions-third/node_modules # ~/.npm
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true' # Only install dependencies if cache was not hit
              working-directory: frontend/github-actions-third
              run: npm ci
            
            - name: Lint Code
              working-directory: frontend/github-actions-third
              run: npm run lint

    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            
            - name: Cache Dependencies
              id: cache
              uses: actions/cache@v3
              with:
                path: frontend/github-actions-third/node_modules
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
            
            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true' # Only install dependencies if cache was not hit
              working-directory: frontend/github-actions-third
              run: npm ci

            - name: Test Code
              id: test-step
              working-directory: frontend/github-actions-third
              run: npm run test

            - name: Upload Test Results
              if: failure() && steps.test-step.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: frontend/github-actions-third/test.json

    build:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            
            - name: Cache Dependencies
              id: cache
              uses: actions/cache@v3
              with:
                path: frontend/github-actions-third/node_modules
                key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

            - name: Install Dependencies
              if: steps.cache.outputs.cache-hit != 'true' # Only install dependencies if cache was not hit
              working-directory: frontend/github-actions-third
              run: npm ci

            - name: Build Code
              working-directory: frontend/github-actions-third
              run: npm run build

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: dist-files
                path: |
                    frontend/github-actions-third/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v3
            
            - name: Download Build Artifacts
              uses: actions/download-artifact@v4
              with:
                name: dist-files

            - name: Output contents
              run: ls -la
            
            - name: Deploy Code
              run: echo "Deploying code..."

    report:
      needs: [lint, deploy]
      if: failure() # Only run this job if any of the previous jobs have failed
      runs-on: ubuntu-latest
      steps:
          - name: Output information
            run: |
              echo "Something went wrong"
              echo "${{ github }}"