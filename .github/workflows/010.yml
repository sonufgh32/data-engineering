name: Container Deployment
on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    CACHE_KEY: node-deps
    MONGODB_DB_NAME: gha-demo

jobs:
    test:
        defaults:
          run:
            working-directory: frontend/github-actions-container
        environment: SAT
        runs-on: ubuntu-latest
        container:
          image: node:16
          # env:
          #   key: value
        env:
            MONGODB_CONNECTION_PROTOCOL: mongodb+srv
            MONGODB_CLUSTER_ADDRESS: gh-demo-container.x3ygcel.mongodb.net
            MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
            MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
            PORT: 8080
        steps:
        - name: Get Code
          uses: actions/checkout@v3

        - name: Cache dependencies
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}

        - name: Install dependencies
          run: npm ci

        - name: Run server
          run: npm start & npx wait-on http://127.0.0.1:${{ env.PORT }} # requires MongoDB Atlas to accept requests from anywhere!
        - name: Run tests
          run: npm test

        - name: Output information
          run: |
            echo "MONGODB_USERNAME: $MONGODB_USERNAME"

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
        - name: Output information
          env:
            PORT: 3000
          run: |        
            echo "MONGODB_DB_NAME: ${{ env.MONGODB_DB_NAME }}"
            echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
            echo "${{ env.PORT }}"
