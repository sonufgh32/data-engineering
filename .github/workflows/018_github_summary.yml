# File: .github/workflows/github-step-summary-demo.yml

name: 018 - GitHub Step Summary Demo

on:
  workflow_dispatch:
#   push:
#     branches:
#       - main

jobs:
  step-summary-demo:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # STEP 1 - Checkout Repository
      # ---------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # STEP 2 - Create Variables
      # ---------------------------------------------------------
      - name: Define Variables
        id: vars
        run: |
          echo "APP_NAME=Data Engineering Portal" >> $GITHUB_ENV
          echo "BUILD_VERSION=1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "CURRENT_DATE=$(date)" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # STEP 3 - Simulate Build
      # ---------------------------------------------------------
      - name: Build Application
        id: build
        run: |
          echo "Starting build process..."

          mkdir -p dist

          echo "<h1>Application Build Successful</h1>" > dist/index.html

          echo "BUILD_STATUS=SUCCESS" >> $GITHUB_ENV
          echo "ARTIFACT_COUNT=$(find dist -type f | wc -l)" >> $GITHUB_ENV

          echo "Build completed successfully."

      # ---------------------------------------------------------
      # STEP 4 - Simulate Testing
      # ---------------------------------------------------------
      - name: Run Tests
        id: tests
        run: |
          echo "Running Unit Tests..."
          sleep 2

          echo "TOTAL_TESTS=120" >> $GITHUB_ENV
          echo "PASSED_TESTS=118" >> $GITHUB_ENV
          echo "FAILED_TESTS=2" >> $GITHUB_ENV
          echo "TEST_COVERAGE=92%" >> $GITHUB_ENV

          echo "Tests execution completed."

      # ---------------------------------------------------------
      # STEP 5 - Create Large Workflow Summary
      # ---------------------------------------------------------
      - name: Generate Workflow Summary
        run: |

          echo "# 🚀 GitHub Actions Workflow Execution Summary" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          echo "## 📌 Workflow Information" >> $GITHUB_STEP_SUMMARY

          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Name | $GITHUB_WORKFLOW |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | $GITHUB_REPOSITORY |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $GITHUB_REF_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | $GITHUB_SHA |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | $GITHUB_RUN_NUMBER |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | $GITHUB_ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger Event | $GITHUB_EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner OS | $RUNNER_OS |" >> $GITHUB_STEP_SUMMARY
          echo "| Current Date | $CURRENT_DATE |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🏗️ Build Information" >> $GITHUB_STEP_SUMMARY

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Application Name | $APP_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Version | $BUILD_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| Generated Artifacts | $ARTIFACT_COUNT |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY

          echo "| Test Metric | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed Tests | $PASSED_TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed Tests | $FAILED_TESTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | $TEST_COVERAGE |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📂 Generated Files" >> $GITHUB_STEP_SUMMARY

          echo '```text' >> $GITHUB_STEP_SUMMARY
          find dist -type f >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🌍 Important Environment Variables" >> $GITHUB_STEP_SUMMARY

          echo "| Variable | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_WORKFLOW | Workflow Name |" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_RUN_ID | Unique Run ID |" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_RUN_NUMBER | Incremental Run Number |" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_SHA | Commit SHA |" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_ACTOR | User Triggering Workflow |" >> $GITHUB_STEP_SUMMARY
          echo "| GITHUB_REF_NAME | Branch Name |" >> $GITHUB_STEP_SUMMARY
          echo "| RUNNER_OS | Runner Operating System |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## ✅ Workflow Conclusion" >> $GITHUB_STEP_SUMMARY

          echo "The workflow completed successfully with generated reports, test metrics, and build artifacts." >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          echo "> Generated using GitHub Actions Step Summary Feature." >> $GITHUB_STEP_SUMMARY

      # ---------------------------------------------------------
      # STEP 6 - Upload Artifact
      # ---------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: dist/